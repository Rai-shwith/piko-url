services:
  db:
    image: mysql:8.0
    container_name: piko_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pikourl
      MYSQL_USER: pikouser
      MYSQL_PASSWORD: pikopassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piko_net

  backend:
    build:
      context: ./backend
    container_name: piko_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=pikourl
      - DB_USER=pikouser
      - DB_PASSWORD=pikopassword
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    networks:
      - piko_net

  frontend:
    build:
      context: ./frontend
    container_name: piko_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - piko_net

volumes:
  db_data:
    driver: local

networks:
  piko_net:
    driver: bridge
